<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng sinh nhật cô</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap&subset=vietnamese">
<style>
:root{--bg1:#ffe3ec;--bg2:#fff4d6;--card:#ffffffcc;--ink:#5b2a46;--pink:#ff7aa8;--soft:#ffb3cd;--yellow:#ffd36e;--cream:#fff6e8;--choco:#8a4b38;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a1f33;--bg2:#2b2540;--card:#4a2a4399;--ink:#ffe6f0;--cream:#f6e3d3}}
:root[data-theme="dark"]{--bg1:#3a1f33;--bg2:#2b2540;--card:#4a2a4399;--ink:#ffe6f0;--cream:#f6e3d3}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Quicksand',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-color:var(--bg1);display:flex;justify-content:center;overflow-x:hidden}
main{width:100%;max-width:440px;padding:20px 18px 40px;text-align:center;position:relative;z-index:2}
h1{font-family:'Pacifico',cursive;font-weight:400;font-size:2rem;line-height:1.3;margin:6px 0 4px;color:var(--pink)}
.sub{margin:0 0 14px;font-weight:700}
.card{background:var(--card);border-radius:28px;padding:18px;backdrop-filter:blur(6px);box-shadow:0 8px 24px #ff7aa833}
input,textarea{width:100%;font:inherit;color:var(--ink);background:#ffffff88;border:2px dashed var(--soft);border-radius:16px;padding:10px 12px;margin:4px 0;text-align:center}
textarea{resize:none;height:84px}
.cake{width:230px;height:auto;margin:6px auto 0;display:block;cursor:pointer;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.flame{transform-origin:center bottom;animation:flick .5s ease-in-out infinite alternate;transition:opacity .4s}
@keyframes flick{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.15) rotate(4deg)}}
.out .flame{opacity:0;animation:none}
.smoke{opacity:0}.out .smoke{animation:up 1.6s ease-out}
@keyframes up{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-26px)}}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 24px;background:var(--pink);color:#fff;box-shadow:0 5px 0 #d9547f;cursor:pointer;margin-top:8px}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #d9547f}
#letter{max-height:0;opacity:0;overflow:hidden;transition:all .8s ease;margin-top:0}
#letter.show{max-height:480px;opacity:1;margin-top:16px}
#letter .paper{background:var(--cream);color:#5b2a46;border-radius:20px;padding:18px;border:3px solid var(--soft);white-space:pre-wrap;line-height:1.6;text-align:left}
canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
.heart{position:fixed;bottom:-30px;z-index:1;opacity:.7;animation:fly linear forwards;pointer-events:none}
@keyframes fly{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.hint{font-size:.85rem;opacity:.8;margin:2px 0 0}
#mus{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:9;margin:0;padding:8px 14px;font-size:.85rem;background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--soft);backdrop-filter:blur(6px)}
#mus.on{animation:bob 2s ease-in-out infinite}
</style>
</head>
<body>
<main>
<h1>Chúc mừng sinh nhật cô!</h1>
<p class="sub" id="to">Gửi cô Hồng Nhung Trần 💖</p>

<div class="card">
<svg id="cake" class="cake" viewBox="0 0 230 210" aria-label="Bánh sinh nhật, chạm để thổi nến">
<ellipse cx="115" cy="196" rx="100" ry="10" fill="#00000018"/>
<rect x="30" y="120" width="170" height="70" rx="18" fill="#ffb3cd"/>
<path d="M30 138 q14 18 28 0 q14 18 28 0 q14 18 28 0 q14 18 28 0 q14 18 28 0 q14 18 28 0 V120 H30z" fill="#fff6e8"/>
<rect x="55" y="70" width="120" height="56" rx="16" fill="#ffd36e"/>
<path d="M55 86 q12 16 24 0 q12 16 24 0 q12 16 24 0 q12 16 24 0 q12 16 24 0 V70 H55z" fill="#fff6e8"/>
<circle cx="70" cy="165" r="6" fill="#ff7aa8"/><circle cx="115" cy="170" r="6" fill="#ffd36e"/><circle cx="160" cy="165" r="6" fill="#ff7aa8"/>
<circle cx="98" cy="108" r="5" fill="#ff7aa8"/><circle cx="132" cy="108" r="5" fill="#ff7aa8"/>
<circle cx="104" cy="150" r="3" fill="#8a4b38"/><circle cx="126" cy="150" r="3" fill="#8a4b38"/>
<path d="M108 156 q7 7 14 0" stroke="#8a4b38" stroke-width="3" fill="none" stroke-linecap="round"/>
<ellipse cx="94" cy="156" rx="6" ry="4" fill="#ff7aa8" opacity=".6"/><ellipse cx="136" cy="156" rx="6" ry="4" fill="#ff7aa8" opacity=".6"/>
<g>
<rect x="84" y="44" width="8" height="28" rx="3" fill="#7ec8ff"/>
<rect x="111" y="40" width="8" height="32" rx="3" fill="#ff7aa8"/>
<rect x="138" y="44" width="8" height="28" rx="3" fill="#a8e6a1"/>
<g class="flame"><path d="M88 42 q-8-10 0-20 q8 10 0 20z" fill="#ffb02e"/><path d="M88 40 q-4-6 0-12 q4 6 0 12z" fill="#fff3a0"/></g>
<g class="flame" style="animation-delay:.15s"><path d="M115 38 q-8-10 0-20 q8 10 0 20z" fill="#ffb02e"/><path d="M115 36 q-4-6 0-12 q4 6 0 12z" fill="#fff3a0"/></g>
<g class="flame" style="animation-delay:.3s"><path d="M142 42 q-8-10 0-20 q8 10 0 20z" fill="#ffb02e"/><path d="M142 40 q-4-6 0-12 q4 6 0 12z" fill="#fff3a0"/></g>
<path class="smoke" d="M88 38 q-6-8 0-16 M115 34 q-6-8 0-16 M142 38 q-6-8 0-16" stroke="#aaa" stroke-width="3" fill="none" stroke-linecap="round"/>
</g>
</svg>
<p class="hint" id="hint">Chạm vào bánh để thổi nến nhé 🎂</p>
<button id="btn">Thổi nến 🌬️</button>
</div>

<div id="letter"><div class="paper" id="paper"></div></div>

<div class="card" style="margin-top:16px">
<p class="hint" style="margin-bottom:6px">✏️ Sửa tên và lời chúc cho hợp với cô của bạn</p>
<input id="name" value="cô Hồng Nhung Trần" placeholder="Tên cô (vd: cô Lan)" maxlength="30">
<textarea id="msg" maxlength="400">Hôm nay là ngày của cô nên em chúc cô thật nhiều sức khỏe, luôn tươi như hoa và mỗi ngày đều vui nhé! Cảm ơn cô đã kiên nhẫn dạy dỗ và truyền cảm hứng cho tụi em. Chúc cô sinh nhật thật ngọt ngào, như chiếc bánh này vậy! 🎂💐</textarea>
</div>
</main>
<button id="mus" aria-label="Bật hoặc tắt nhạc nền">🎵 Bật nhạc</button>
<canvas id="c"></canvas>

<script>
var cake=document.getElementById('cake'),btn=document.getElementById('btn'),hint=document.getElementById('hint'),
nameEl=document.getElementById('name'),msgEl=document.getElementById('msg'),to=document.getElementById('to'),
letter=document.getElementById('letter'),paper=document.getElementById('paper'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
var blown=false,parts=[],running=false;
function resize(){cv.width=innerWidth;cv.height=innerHeight}
resize();addEventListener('resize',resize);
function who(){var n=nameEl.value.trim();return n||'cô'}
function nameFmt(){var n=nameEl.value.trim();return n?n.charAt(0).toUpperCase()+n.slice(1):'Cô'}
function updateTo(){to.textContent='Gửi '+(nameEl.value.trim()?nameEl.value.trim():'cô giáo đáng yêu')+' 💖'}
nameEl.addEventListener('input',updateTo);
function hearts(){var e=['💖','🌸','✨','💐','🎀','🎈'];
for(var i=0;i<14;i++){(function(i){setTimeout(function(){var h=document.createElement('div');h.className='heart';
h.textContent=e[Math.floor(Math.random()*e.length)];h.style.left=Math.random()*95+'vw';h.style.fontSize=(16+Math.random()*18)+'px';
h.style.animationDuration=(4+Math.random()*4)+'s';document.body.appendChild(h);setTimeout(function(){h.remove()},9000)},i*180)})(i)}}
function firework(x,y){var cols=['#ff7aa8','#ffd36e','#7ec8ff','#a8e6a1','#c9a7ff','#ffffff'];var c=cols[Math.floor(Math.random()*6)],c2=cols[Math.floor(Math.random()*6)];
for(var i=0;i<70;i++){var a=Math.PI*2*i/70,s=2+Math.random()*3.5;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,s:3+Math.random()*2,c:i%2?c:c2,r:0,l:70+Math.random()*30,g:.06,f:.97,o:1})}
if(!running){running=true;loop()}}
function fireworks(){for(var i=0;i<7;i++){(function(i){setTimeout(function(){firework(innerWidth*(.15+Math.random()*.7),innerHeight*(.12+Math.random()*.3))},i*450)})(i)}}
function confetti(){var cols=['#ff7aa8','#ffd36e','#7ec8ff','#a8e6a1','#c9a7ff'];
for(var i=0;i<140;i++){parts.push({x:innerWidth/2,y:innerHeight*0.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-2,s:4+Math.random()*6,c:cols[i%5],r:Math.random()*6,l:160})}
if(!running){running=true;loop()}}
function loop(){ctx.clearRect(0,0,cv.width,cv.height);
parts=parts.filter(function(p){return p.l>0});
parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=(p.g||.3);p.vx*=(p.f||.99);p.r+=.2;p.l--;ctx.save();ctx.globalAlpha=Math.min(1,p.l/40);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;if(p.o){ctx.shadowColor=p.c;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(0,0,p.s/2,0,6.3);ctx.fill()}else{ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6)}ctx.restore()});
if(parts.length)requestAnimationFrame(loop);else{running=false;ctx.clearRect(0,0,cv.width,cv.height)}}
function blow(){
if(blown){blown=false;cake.classList.remove('out');letter.classList.remove('show');btn.textContent='Thổi nến 🌬️';hint.textContent='Chạm vào bánh để thổi nến nhé 🎂';return}
blown=true;cake.classList.add('out');confetti();fireworks();hearts();
paper.textContent='🎉 Happy Birthday '+nameFmt()+'! 🎉\n\n'+msgEl.value;
letter.classList.add('show');btn.textContent='Thắp nến lại 🕯️';hint.textContent='Điều ước của cô sẽ thành sự thật nha ✨';
setTimeout(function(){letter.scrollIntoView({behavior:'smooth',block:'center'})},400)}
btn.addEventListener('click',blow);cake.addEventListener('click',function(){if(!blown)blow()});

/* Canon in D (Pachelbel) - phối bằng Web Audio, giọng hộp nhạc */
var AC=null,mg=null,mplaying=false,muted=false,nextT=0,mstep=0,mtimer=null,mus=document.getElementById('mus');
var BASS=[50,45,47,42,43,38,43,45],CD=1.7;
var CH=[[62,66,69],[57,61,64],[59,62,66],[54,57,61],[55,59,62],[62,66,69],[55,59,62],[57,61,64]];
var MA=[78,76,74,73,71,69,71,73],MB=[74,73,71,69,67,66,67,69];
function fr(m){return 440*Math.pow(2,(m-69)/12)}
function note(m,t,d,v){var f=fr(m),g=AC.createGain(),lp=AC.createBiquadFilter();
lp.type='lowpass';lp.frequency.setValueAtTime(Math.min(f*8,6000),t);lp.frequency.exponentialRampToValueAtTime(Math.max(f*1.5,300),t+d);
var dec=Math.max(d*1.6,1.4)*(m<55?1.3:1);
g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v*0.7,t+0.008);g.gain.exponentialRampToValueAtTime(v*0.25,t+0.25);g.gain.exponentialRampToValueAtTime(0.0001,t+dec);
[[1,1],[2,0.35],[3,0.15],[4,0.06]].forEach(function(h){var o=AC.createOscillator(),hg=AC.createGain();o.type='sine';o.frequency.value=f*h[0]*(h[0]>1?1.0008:1);hg.gain.value=h[1];o.connect(hg);hg.connect(lp);o.start(t);o.stop(t+dec+0.1)});
lp.connect(g);g.connect(mg)}
function bar(t){var i=mstep%8,cyc=Math.floor(mstep/8)%3,c=CH[i];
note(BASS[i],t,CD*1.1,0.5);
if(cyc<2){note(cyc==0?MA[i]:MB[i],t,CD,0.35);c.forEach(function(m){note(m,t+0.01,CD*0.9,0.09)})}
else{[c[0]+12,c[1]+12,c[2]+12,c[1]+12].forEach(function(m,k){note(m,t+k*CD/4,CD/3,0.28)})}
mstep++}
function sched(){while(nextT<AC.currentTime+0.8){bar(nextT);nextT+=CD}}
function setLabel(){if(mplaying&&AC&&AC.state!=='running'){mus.textContent='🎵 Chạm để nghe';mus.className='';return}mus.textContent=mplaying?'🎶 Canon in D':(muted?'🔇 Nhạc tắt':'🎵 Bật nhạc');mus.className=mplaying?'on':''}
function musicOn(){try{
if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();AC.onstatechange=setLabel;mg=AC.createGain();mg.gain.value=0.22;mg.connect(AC.destination);var cv2=AC.createConvolver(),RL=AC.sampleRate*2,ib=AC.createBuffer(2,RL,AC.sampleRate);for(var ch=0;ch<2;ch++){var dd=ib.getChannelData(ch);for(var k=0;k<RL;k++)dd[k]=(Math.random()*2-1)*Math.pow(1-k/RL,3)}cv2.buffer=ib;var wg=AC.createGain();wg.gain.value=0.5;mg.connect(cv2);cv2.connect(wg);wg.connect(AC.destination)}
AC.resume();mg.gain.cancelScheduledValues(AC.currentTime);mg.gain.setTargetAtTime(0.22,AC.currentTime,0.1);
if(!mplaying){mplaying=true;nextT=AC.currentTime+0.1;sched();mtimer=setInterval(sched,250)}
setLabel()}catch(e){}}
function musicOff(){mplaying=false;clearInterval(mtimer);
if(AC){mg.gain.setTargetAtTime(0,AC.currentTime,0.15);setTimeout(function(){if(!mplaying)AC.suspend()},800)}
setLabel()}
mus.addEventListener('click',function(){if(mplaying&&AC&&AC.state!=='running'){AC.resume();return}if(mplaying){muted=true;musicOff()}else{muted=false;musicOn()}});
function firstTap(e){if(e.target.closest&&e.target.closest('#mus'))return;if(muted)return;if(!mplaying)musicOn();else if(AC&&AC.state!=='running')AC.resume()}
['pointerdown','touchend','click','keydown'].forEach(function(ev){document.addEventListener(ev,firstTap)});musicOn();
</script>
</body>
</html>
